name: Tripwires

# Reusable workflow. A calling repository's workflow does:
#
#   on:
#     push:
#       branches: [main]
#     schedule:
#       - cron: "0 6 * * 1"
#   jobs:
#     tripwires:
#       uses: martinsson/tripwires/.github/workflows/check.yml@main
#
# The caller checks out ITS OWN tree; the script then runs from this
# repository's composite action (action.yml). Nothing about the thresholds
# lives in the caller.
#
# Only ever wire this to the default branch and a schedule — never to
# pull_request. A check nobody has to turn green is a check nobody games.
#
# The failed run is the alert: GitHub mails the owner about a failed workflow
# on the default branch already, so nothing here sends mail.

on:
  workflow_call:

jobs:
  tripwires:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: martinsson/tripwires@main

name: Tripwires
description: Absolute structural limits a healthy codebase never reaches. Red when one is crossed.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -uo pipefail
        python3 "${{ github.action_path }}/tripwires.py" . | tee report.txt
        status=${PIPESTATUS[0]}
        { echo '### Tripwires'; echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        rm -f report.txt
        exit "$status"
